name: CI

# CI HONESTA: a automação de desktop (clicar/digitar/OCR) exige uma tela real e
# os backends nativos (Xlib, pyautogui, uiautomation), então NÃO roda headless.
# Este pipeline afirma só o que é de fato verificável no runner:
#   - lint de ERROS reais (ruff: pyflakes + syntax), sem ruído de estilo;
#   - sintaxe de todo o código (compileall);
#   - smoke test dos módulos PUROS (stdlib): grafo de UI, degradação do UIA fora
#     do Windows, e detecção de capacidades.
# O que precisa de display fica como validação manual (scripts/validate_*.py).
#
# Roda num SELF-HOSTED runner Windows (a org não tem Actions hospedado). Usa o
# Python JÁ INSTALADO na máquina — `actions/setup-python` tenta *instalar* uma
# versão baixada e o instalador quebra em self-hosted. O shell é `powershell`
# (5.1, sempre presente) p/ não depender de pwsh 7 nem de bash no runner.

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: powershell

jobs:
  static:
    name: Lint + sintaxe + smoke
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Python da máquina
        run: python --version

      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Ruff (só erros reais — sem estilo)
        run: python -m ruff check --select E9,F63,F7,F82 src scripts

      - name: Sintaxe (compileall de tudo)
        run: python -m compileall -q src scripts tests

      - name: Smoke test (módulos puros, sem display)
        run: python -m pytest -q tests
